<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hasil Perhitungan Gaji</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5a800, #ffd84d);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #003087;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .result-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 5px;
            border-bottom: 1px solid #ddd;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #555;
        }

        .value {
            font-weight: bold;
            color: #003087;
        }

        .total {
            background: #fff8e7;
            border: 2px solid #f5a800;
            border-radius: 12px;
            padding: 18px;
            margin-top: 20px;
            text-align: center;
        }

        .total h2 {
            color: #003087;
            margin-bottom: 8px;
        }

        .total p {
            font-size: 26px;
            font-weight: bold;
            color: #f5a800;
        }

        .status {
            margin-top: 20px;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            background: #e8f5e9;
        }

        .status h3 {
            color: #2e7d32;
            margin-bottom: 5px;
        }

        .status p {
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
        }

        .button {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px;
            margin-top: 25px;
            background: #003087;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .button:hover {
            background: #00205e;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Hasil Perhitungan</h1>
        <p>Gaji Mingguan John Travolta</p>
    </div>

    <div class="result-box">

        <div class="result-row">
            <span class="label">Jam Kerja</span>
            <span class="value">
                <span th:text="${jamKerja}"></span> jam
            </span>
        </div>

        <div class="result-row">
            <span class="label">Total Pemasukan</span>
            <span class="value">
                Rp <span th:text="${#numbers.formatDecimal(pemasukan, 0, 'COMMA', 0, 'POINT')}"></span>
            </span>
        </div>

        <div class="result-row">
            <span class="label">Pengeluaran</span>
            <span class="value">
                Rp <span th:text="${#numbers.formatDecimal(pengeluaran, 0, 'COMMA', 0, 'POINT')}"></span>
            </span>
        </div>

    </div>

    <div class="total">

        <h2>Tabungan Minggu Ini</h2>

        <p>
            Rp <span th:text="${#numbers.formatDecimal(tabungan, 0, 'COMMA', 0, 'POINT')}"></span>
        </p>

    </div>

    <div class="status">

        <h3>Kondisi Keuangan</h3>

        <p th:text="${kondisi}">
            Kondisi
        </p>

    </div>

    <a href="/" class="button">
        Hitung Lagi
    </a>

    <div class="footer">
        Spring Boot & Thymeleaf
    </div>

</div>

</body>
</html>
